plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.roundkb'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.roundkb"
        minSdk 26          // Wear OS 3+ (API 26)
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 零第三方依赖：全部使用 Android 框架 API，无需下载任何库，打包最快
}
