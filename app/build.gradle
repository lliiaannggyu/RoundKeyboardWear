plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.roundkb'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.roundkb"
        minSdk 26          // Wear OS 3+ (API 26)
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // 仅 Kotlin 标准库（随插件自动添加），无其他第三方依赖
}
